[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist_flow"
version = "0.1.0"
description = "MNIST DDPM vs rectified flow comparison"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "torchvision",
    "numpy",
    "matplotlib",
    "tqdm",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pandas", "jupyter", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mnist_flow"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
